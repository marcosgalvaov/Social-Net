<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>SocialNET - Clubes!</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">


</head>
<body>
<main>

    <header class="cabecalho">

        <figure>
            <img src="/img/logoHeader.png" alt="Logo">

        </figure>
        <ul>
            <li><a href="/telaHome.html"; class="btn" style="color:#5E17EB">HOME</a></li>
            <li><a href="/telaClubes.html"; class="btn" style="color:#8a868b">CLUBES</a></li>
            <li><a href="/telaCriar.html"; class="btn" style="color:#8a868b">CRIAR</a></li>
            <li><a href="#"; id="linkSair" class="btn" style="color:#8a868b">SAIR</a></li>
        </ul>

    </header>
    
    <article id="caixaDescClube">
        <figure id="descClubeId">
            <h1>{{ clube.nome|upper }}</h1>
            <img src="{{ imagem_clube_url(clube.imagem) }}" alt="{{ clube.nome }}">
            <a href="/telaFeed.html?clube={{ clube.id_comunidade }}" class="linkClube">Ver feed do clube</a>
            {% if pode_alterar %}
            <a href="#" id="linkAlterarImagem" class="linkClube" data-id="{{ clube.id_comunidade }}">Alterar imagem</a>
            <input type="file" id="in_imagemClubeTroca" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
            {% endif %}
        </figure>

        <div>
            <div id="descClubeRelative">
                <h2>Descrição:</h2>
                <p>{{ clube.descricao }}</p>
                <button id="descClubeAbsolute" data-id="{{ clube.id_comunidade }}" data-membro="{{ 1 if membro else 0 }}">{{ "SAIR" if membro else "ENTRAR" }}</button>
            </div>
            
        </div>
    </article>

    <footer>
        <p>2026 - @SocialNET todos os direitos reservados</p>
    </footer>

</main>
</body>
</html>
