<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>SocialNET - Clubes!</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">


</head>
<body>
<main>

    <header class="cabecalho">

        <figure>
            <img src="/img/logoHeader.png" alt="Logo">

        </figure>
        <ul>
            <li><a href="/telaHome.html"; class="btn" style="color:#8a868b">HOME</a></li>
            <li><a href="/telaClubes.html"; class="btn" style="color:#5E17EB">CLUBES</a></li>
            <li><a href="/telaCriar.html"; class="btn" style="color:#8a868b">CRIAR</a></li>
            <li><a href="#"; id="linkSair" class="btn" style="color:#8a868b">SAIR</a></li>
        </ul>

    </header>
    
    <div>
        <article id="buscarClubes">
            <h1>Entre para clubes:</h1>
            <div id="barraPesquisa">
                <input type="text" id="campoBusca" placeholder="Digite o nome de um Clube" maxlength="40" value="{{ busca }}">
                <button id="botaoCriar">PROCURAR</button>
            </div>
        </article>

        <article id="selecaoClubes">
            {% for c in clubes %}
            <button class="botaoClube cor-{{ (c.id_comunidade - 1) % 8 }}" data-href="/tela-desc-clube.html?id={{ c.id_comunidade }}">
                <img src="{{ imagem_clube_url(c.imagem) }}" alt="{{ c.nome }}">
                <h1>{{ c.nome|upper }}</h1>
            </button>
            {% else %}
            <p class="feedVazio">Nenhum clube encontrado.</p>
            {% endfor %}
        </article>

    </div>


    <footer>
        <p>2026 - @SocialNET todos os direitos reservados</p>
    </footer>

</main>
</body>
</html>
