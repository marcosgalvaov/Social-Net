<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>SocialNET - Login</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">


</head>
<body>
<main>

    <header class="cabecalho">

        <figure>
            <img src="/img/logoHeader.png" alt="Logo">

        </figure>
        <ul>
            <li><a href="/telaHome.html"; class="btn" style="color:#5E17EB">HOME</a></li>
            <li><a href="/telaClubes.html"; class="btn" style="color:#8a868b">CLUBES</a></li>
            <li><a href="/telaCriar.html"; class="btn" style="color:#8a868b">CRIAR</a></li>
        </ul>

    </header>
    
    <div class="opcoesLogin">
        <a href="/telaCadastro.html" class="button">Criar uma conta</a>
        <a href="/telaLogin.html" class="button">Já tenho uma conta</a>
    </div>

    <article class="caixaLogin" style="text-align: left;">
        <form id="formLogin" data-next="{{ next }}">
            <label for="in_username">Username:</label><br>
            <input type="text" id="in_username" name="in_username" autocomplete="username" required maxlength="30"><br>
            <label for="in_usersenha">Senha:</label><br>
            <input type="password" id="in_usersenha" name="in_usersenha" autocomplete="current-password" required maxlength="128"><br>
            <input type="submit" value="ENTRAR" id="botaoCriar">
        </form>
    </article>

    <footer>
        <p>2026 - @SocialNET todos os direitos reservados</p>
    </footer>

</main>
</body>
</html>
